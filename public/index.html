<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic Research Marketplace</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 860px; margin: 0 auto; }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #a78bfa;
      margin-bottom: 0.25rem;
    }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }

    .location-row {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem; color: #94a3b8;
    }
    .location-text { }
    .location-text.detected { color: #4ade80; font-weight: 600; }
    .location-btn {
      padding: 0.3rem 0.75rem;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 0 8px 1px #2563eb66;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .location-btn:hover:not(:disabled) { background: #1d4ed8; box-shadow: 0 0 12px 2px #3b82f6aa; }
    .location-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .input-row {
      display: flex; gap: 0.75rem; margin-bottom: 2rem;
    }
    #intent {
      flex: 1;
      padding: 0.75rem 1rem;
      background: #1e2130;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
    }
    #intent:focus { border-color: #7c3aed; }

    button {
      padding: 0.75rem 1.5rem;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #6d28d9; }

    #searchPanel { margin-bottom: 2rem; }

    .new-search-btn {
      display: none;
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      background: transparent;
      border: 1px dashed #334155;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .new-search-btn:hover:not(:disabled) {
      border-color: #7c3aed;
      color: #a78bfa;
      background: #1e1a2e;
    }

    .status-bar {
      display: flex; gap: 1.5rem;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .status-bar span { display: flex; align-items: center; gap: 0.3rem; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge-on { background: #14532d; color: #4ade80; }
    .badge-off { background: #1e293b; color: #64748b; }

    #output { display: none; }

    .card {
      background: #1e2130;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .card-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7c3aed;
      margin-bottom: 0.75rem;
    }

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.6rem;
    }
    .plan-chip {
      background: #0f1117;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.82rem;
    }
    .plan-chip .role { font-weight: 700; color: #a78bfa; }
    .plan-chip .q { color: #94a3b8; margin-top: 0.2rem; font-size: 0.75rem; }

    .worker-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .worker {
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 0.9rem 1rem;
    }
    .worker-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .worker-title { font-weight: 700; font-size: 0.9rem; }
    .worker-meta { font-size: 0.75rem; color: #64748b; text-align: right; }
    .service-tag {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-left: 0.3rem;
    }
    .tag-discovered { background: #1e3a5f; color: #60a5fa; }
    .tag-default { background: #1c2a1c; color: #4ade80; }
    .tag-category { background: #2d1f4e; color: #c4b5fd; }

    .tx-link {
      display: inline-block;
      font-size: 0.72rem;
      color: #7c3aed;
      text-decoration: none;
      word-break: break-all;
    }
    .tx-link:hover { text-decoration: underline; }

    .finding { padding: 0.4rem 0; border-top: 1px solid #1e2130; }
    .finding:first-child { border-top: none; }
    .finding a { color: #93c5fd; font-size: 0.82rem; text-decoration: none; }
    .finding a:hover { text-decoration: underline; }
    .finding .snippet { color: #64748b; font-size: 0.75rem; margin-top: 0.15rem; }
    .findings-toggle { font-size: 0.75rem; color: #7c3aed; cursor: pointer; margin-top: 0.5rem; }

    .answer-text {
      line-height: 1.7;
      font-size: 0.92rem;
      color: #cbd5e1;
    }
    .answer-text a { color: #93c5fd; }

    .spend-row {
      display: flex; justify-content: space-between;
      font-size: 0.82rem; color: #94a3b8;
      padding: 0.25rem 0;
      border-bottom: 1px solid #1e2130;
    }
    .spend-row:last-child { border-bottom: none; font-weight: 700; color: #e2e8f0; }

    .log-box {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.8rem;
      max-height: 200px;
      overflow-y: auto;
      padding: 0.75rem 1rem;
      background: #0d1117;
      border-radius: 8px;
      border: 1px solid #1e2a3a;
      margin-top: 0.5rem;
    }
    .log-line {
      display: flex;
      gap: 0.75rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-ts { color: #374151; flex-shrink: 0; user-select: none; }
    .log-line.info  .log-text { color: #94a3b8; }
    .log-line.success .log-text { color: #4ade80; }
    .log-line.warn  .log-text { color: #fbbf24; }

    .launch-card {
      display: none;
      text-align: center;
      padding: 2.5rem 1rem;
      margin-bottom: 1rem;
      background: #1e2130;
      border: 1px solid #2d3748;
      border-radius: 10px;
    }
    .launch-ring {
      width: 52px; height: 52px;
      border: 4px solid #2d3748;
      border-top-color: #7c3aed;
      border-right-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    .launch-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 0.4rem;
    }
    .launch-query {
      font-size: 0.85rem;
      color: #7c3aed;
      font-style: italic;
      margin-bottom: 0.75rem;
      padding: 0 1rem;
    }
    .launch-steps {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      font-size: 0.75rem;
      color: #475569;
    }
    .launch-step { display: flex; align-items: center; gap: 0.35rem; }
    .step-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #334155;
      animation: pulse-dot 1.4s ease-in-out infinite;
    }
    .launch-step:nth-child(2) .step-dot { animation-delay: 0.2s; }
    .launch-step:nth-child(3) .step-dot { animation-delay: 0.4s; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #334155;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .synth-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      gap: 0.75rem;
    }
    .synth-spinner {
      width: 48px; height: 48px;
      border: 4px solid #2d3748;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .synth-label {
      font-size: 1rem;
      font-weight: 700;
      color: #a78bfa;
    }
    .synth-sub {
      font-size: 0.82rem;
      color: #64748b;
    }
    .synth-dots {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.25rem;
    }
    .synth-dots span {
      width: 8px; height: 8px;
      background: #7c3aed;
      border-radius: 50%;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    .synth-dots span:nth-child(2) { animation-delay: 0.2s; }
    .synth-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    @media (max-width: 600px) {
      .input-row { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Agentic Research Marketplace</h1>
  <p class="subtitle">x402 micropayments · CDP wallet · Bazaar discovery · Base mainnet</p>

  <div class="status-bar" id="statusBar">
    <span>Loading status...</span>
  </div>

  <div id="searchPanel">
    <div class="location-row" id="locationRow">
      <span class="location-icon">📍</span>
      <span id="locationText" class="location-text" style="display:none">Location not set</span>
      <span id="locationSizer" style="position:absolute;visibility:hidden;white-space:pre;font-size:0.75rem;padding:0 0.4rem;pointer-events:none"></span>
      <input id="locationInput" type="text" placeholder="City…"
             style="min-width:60px;max-width:220px;width:60px;padding:0.2rem 0.4rem;background:#1e2130;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:0.75rem;outline:none"
             oninput="setManualLocation(this.value);sizeLocationInput()"
             onfocus="this.style.borderColor='#2563eb'"
             onblur="this.style.borderColor='#334155'" />
      <button class="location-btn" onclick="detectLocation()">Detect</button>
    </div>
    <div class="input-row">
      <input id="intent" type="text" placeholder="Ask a complex research question…"
             onkeydown="if(event.key==='Enter')startRun()" />
      <button id="runBtn" onclick="startRun()">Research</button>
    </div>
  </div>

  <div id="output" style="display:none">
    <button class="new-search-btn" id="newSearchBtn" onclick="resetSearch()">+ Start Another Search</button>

    <div class="launch-card" id="launchCard">
      <div class="launch-ring"></div>
      <div class="launch-title">Launching Research Agents…</div>
      <div class="launch-query" id="launchQuery"></div>
      <div class="launch-steps">
        <div class="launch-step"><div class="step-dot"></div>Planning tasks</div>
        <div class="launch-step"><div class="step-dot"></div>Querying Bazaar</div>
        <div class="launch-step"><div class="step-dot"></div>Searching sources</div>
      </div>
    </div>

    <div class="card" id="answerCard" style="display:none">
      <div class="card-title">AI Analysis &amp; Recommendations</div>
      <div class="answer-text" id="answerText"></div>
    </div>

    <div class="card" id="workersCard" style="display:none">
      <div class="card-title">Worker Agents</div>
      <div class="worker-list" id="workerList"></div>
    </div>

    <div class="card" id="planCard" style="display:none">
      <div class="card-title">Research Plan</div>
      <div class="plan-grid" id="planGrid"></div>
    </div>

    <div class="card" id="spendCard" style="display:none">
      <div class="card-title">Spend Breakdown</div>
      <div id="spendTable"></div>
    </div>

    <div class="card" id="logCard">
      <div class="card-title">Progress Log</div>
      <div class="log-box" id="logBox"></div>
    </div>
  </div>
</div>

<script>
let running = false;
const workers = {};
let userLocation = '';

function resetSearch() {
  document.getElementById('output').style.display = 'none';
  document.getElementById('searchPanel').style.display = 'block';
  document.getElementById('intent').focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function sizeLocationInput() {
  const input = document.getElementById('locationInput');
  const sizer = document.getElementById('locationSizer');
  sizer.textContent = input.value || input.placeholder;
  input.style.width = Math.min(Math.max(sizer.offsetWidth + 8, 60), 220) + 'px';
}

function setManualLocation(val) {
  userLocation = val.trim();
}

function applyLocation(city) {
  const input = document.getElementById('locationInput');
  const btn = document.querySelector('.location-btn');
  userLocation = city;
  input.value = city;
  input.style.borderColor = '#22c55e';
  btn.textContent = 'Detect';
  btn.disabled = false;
  sizeLocationInput();
}

async function ipFallback() {
  const input = document.getElementById('locationInput');
  const btn = document.querySelector('.location-btn');
  try {
    const res = await fetch('https://ipapi.co/json/');
    const d = await res.json();
    const city = [d.city, d.region, d.country_code].filter(Boolean).join(', ');
    if (city) {
      // IP geolocation is approximate — pre-fill but highlight for correction
      userLocation = city;
      input.value = city;
      input.style.borderColor = '#f59e0b';
      input.title = 'Approximate — based on your IP address. Edit if incorrect.';
      input.select();
      btn.textContent = 'Detect';
      btn.disabled = false;
      sizeLocationInput();
      return;
    }
  } catch {}
  input.placeholder = 'Type your city (e.g. New York, NY)';
  input.focus();
  btn.textContent = 'Detect';
  btn.disabled = false;
}

async function reverseGeocode(lat, lon) {
  const res = await fetch(
    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,
    { headers: { 'Accept-Language': 'en', 'User-Agent': 'AgenticResearchMarketplace/1.0' } }
  );
  const d = await res.json();
  const city = d.address?.city || d.address?.town || d.address?.village || d.address?.county || '';
  const state = d.address?.state || '';
  const country = d.address?.country_code?.toUpperCase() || '';
  return [city, state, country].filter(Boolean).join(', ');
}

async function detectLocation() {
  const btn = document.querySelector('.location-btn');
  const input = document.getElementById('locationInput');
  btn.textContent = 'Detecting…';
  btn.disabled = true;
  input.style.borderColor = '#334155';

  if (!navigator.geolocation) {
    await ipFallback();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      try {
        const named = await reverseGeocode(latitude, longitude);
        applyLocation(named || `${latitude.toFixed(3)}, ${longitude.toFixed(3)}`);
      } catch {
        applyLocation(`${latitude.toFixed(3)}, ${longitude.toFixed(3)}`);
      }
    },
    async (err) => {
      if (err.code === 1) {
        // User denied — don't fall back silently, tell them
        const input = document.getElementById('locationInput');
        const btn = document.querySelector('.location-btn');
        input.placeholder = 'Permission denied — type your city manually';
        btn.textContent = 'Detect';
        btn.disabled = false;
      } else {
        // Unavailable or timeout — try IP geolocation silently
        await ipFallback();
      }
    },
    { timeout: 8000, maximumAge: 300000, enableHighAccuracy: false }
  );
}

async function loadStatus() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    window._statusFlags = s.flags;
    const bar = document.getElementById('statusBar');
    const remainingPct = s.maxSpend > 0 ? (s.remainingBudget / s.maxSpend) * 100 : 100;
    const budgetColor = remainingPct > 50 ? '#4ade80' : remainingPct > 20 ? '#fbbf24' : '#f87171';
    bar.innerHTML = `
      <span>Wallet: <code style="color:#a78bfa">${s.walletAddress.slice(0,8)}…${s.walletAddress.slice(-4)}</code></span>
      <span>Budget: <b style="color:${budgetColor}">$${s.remainingBudget.toFixed(2)}</b> remaining / $${s.maxSpend.toFixed(2)}</span>
      <span>Network: <code style="color:#94a3b8">${s.flags.NETWORK || 'base-mainnet'}</code></span>
      <span>x402 <span class="badge ${s.flags.USE_X402 ? 'badge-on' : 'badge-off'}">${s.flags.USE_X402 ? 'ON' : 'OFF'}</span></span>
      <span>Discovery <span class="badge ${s.flags.USE_DISCOVERY ? 'badge-on' : 'badge-off'}">${s.flags.USE_DISCOVERY ? 'ON' : 'OFF'}</span></span>
      <span>Max agents: ${s.flags.MAX_AGENTS}</span>
    `;
  } catch (e) {
    document.getElementById('statusBar').textContent = 'Status unavailable';
  }
}

const LOG_PREFIX = { info: '›', success: '✓', warn: '!' };

function log(msg, cls = 'info') {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = `log-line ${cls}`;
  const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  line.innerHTML = `<span class="log-ts">${t}</span><span class="log-text">${LOG_PREFIX[cls]} ${escHtml(msg)}</span>`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function startRun() {
  if (running) return;
  const intent = document.getElementById('intent').value.trim();
  if (!intent) return;

  running = true;
  document.getElementById('runBtn').disabled = true;
  document.getElementById('searchPanel').style.display = 'none';
  document.getElementById('output').style.display = 'block';
  document.getElementById('newSearchBtn').style.display = 'none';
  document.getElementById('launchCard').style.display = 'block';
  document.getElementById('launchQuery').textContent = `"${intent}"`;
  document.getElementById('planCard').style.display = 'none';
  document.getElementById('workersCard').style.display = 'none';
  document.getElementById('spendCard').style.display = 'none';
  document.getElementById('answerCard').style.display = 'none';
  document.getElementById('planGrid').innerHTML = '';
  document.getElementById('workerList').innerHTML = '';
  document.getElementById('spendTable').innerHTML = '';
  document.getElementById('answerText').innerHTML = '';
  document.getElementById('logBox').innerHTML = '';
  Object.keys(workers).forEach(k => delete workers[k]);
  window.scrollTo({ top: 0, behavior: 'smooth' });

  log(`Researching: "${intent}"${userLocation ? ` · 📍 ${userLocation}` : ''}`);

  const url = `/api/run?intent=${encodeURIComponent(intent)}${userLocation ? `&location=${encodeURIComponent(userLocation)}` : ''}`;
  const es = new EventSource(url);

  es.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleUpdate(data);
    if (data.type === 'done' || data.type === 'close' || data.type === 'error') {
      es.close();
      running = false;
      document.getElementById('runBtn').disabled = false;
      loadStatus();
    }
  };

  es.onerror = () => {
    log('Connection lost — please try again', 'warn');
    es.close();
    running = false;
    document.getElementById('runBtn').disabled = false;
  };
}

function handleUpdate(data) {
  switch (data.type) {
    case 'planning':
      log('Claude is planning your research…');
      break;

    case 'plan_ready': {
      document.getElementById('launchCard').style.display = 'none';
      const grid = document.getElementById('planGrid');
      grid.innerHTML = '';
      data.tasks.forEach((t, i) => {
        const chip = document.createElement('div');
        chip.className = 'plan-chip';
        chip.innerHTML = `<div class="role">${escHtml(t.role)}</div><div class="q">${escHtml(t.subQuestion)}</div>`;
        grid.appendChild(chip);
      });
      document.getElementById('planCard').style.display = 'block';
      log(`Research plan ready — ${data.tasks.length} specialist agents assigned`);
      break;
    }

    case 'worker_start': {
      const list = document.getElementById('workerList');
      const tagClass = data.serviceSource === 'discovered' ? 'tag-discovered' : 'tag-default';
      const tagText = data.serviceSource === 'discovered' ? 'discovered' : 'default';
      const div = document.createElement('div');
      div.className = 'worker';
      div.id = `worker-${data.taskIndex}`;
      const categoryTag = (data.serviceCategory && data.serviceCategory !== 'general')
        ? `<span class="service-tag tag-category">${escHtml(data.serviceCategory)}</span>`
        : '';
      div.innerHTML = `
        <div class="worker-header">
          <div class="worker-title"><span class="spinner"></span>${escHtml(data.role)}</div>
          <div class="worker-meta">
            ${escHtml(data.service)}
            <span class="service-tag ${tagClass}">${tagText}</span>
            ${categoryTag}
          </div>
        </div>
        <div class="worker-findings" id="wf-${data.taskIndex}">Searching…</div>
      `;
      list.appendChild(div);
      document.getElementById('workersCard').style.display = 'block';
      log(`Agent "${data.role}" searching via ${data.service}${data.serviceCategory && data.serviceCategory !== 'general' ? ` [${data.serviceCategory}]` : ''}`);
      break;
    }

    case 'worker_done': {
      const r = data.result;
      const container = document.getElementById(`worker-${r.taskIndex}`);
      if (!container) break;

      // Remove spinner
      const spinner = container.querySelector('.spinner');
      if (spinner) spinner.remove();

      const wf = document.getElementById(`wf-${r.taskIndex}`);
      const topFindings = r.findings.slice(0, 3);
      let html = topFindings.map(f =>
        `<div class="finding"><a href="${escHtml(f.url)}" target="_blank">${escHtml(f.title)}</a>
         <div class="snippet">${escHtml((f.content || '').slice(0, 120))}…</div></div>`
      ).join('');

      if (r.txHashes.length) {
        html += `<div style="margin-top:0.5rem">${r.txHashes.map(h =>
          `<a class="tx-link" href="https://basescan.org/tx/${h}" target="_blank">⛓ ${h.slice(0,10)}…${h.slice(-6)}</a>`
        ).join(' ')}</div>`;
      }
      if (!topFindings.length) html = '<div style="color:#64748b;font-size:0.8rem">No results</div>';
      wf.innerHTML = html;

      workers[r.taskIndex] = r;
      updateSpend(null);
      log(`"${r.task?.role}" found ${r.findings.length} sources across ${r.queriesRun} ${r.queriesRun === 1 ? 'query' : 'queries'}`, 'success');
      break;
    }

    case 'synthesizing': {
      document.getElementById('answerCard').style.display = 'block';
      document.getElementById('answerText').innerHTML = `
        <div class="synth-loading">
          <div class="synth-spinner"></div>
          <div class="synth-label">Generating AI Analysis &amp; Recommendations…</div>
          <div class="synth-sub">Claude is reading all research findings and writing your answer</div>
          <div class="synth-dots"><span></span><span></span><span></span></div>
        </div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      log('All agents done — Claude is writing your analysis…');
      break;
    }

    case 'done': {
      const res = data.result;
      const answerEl = document.getElementById('answerText');
      answerEl.innerHTML = renderMarkdown(res.answer);
      document.getElementById('answerCard').style.display = 'block';
      document.getElementById('newSearchBtn').style.display = 'block';
      updateSpend(res.claudeCostUsd ?? null);
      log('Analysis complete — see your results above', 'success');
      break;
    }

    case 'error':
      document.getElementById('launchCard').style.display = 'none';
      document.getElementById('newSearchBtn').style.display = 'block';
      log(`Error: ${data.message}`, 'warn');
      break;
  }
}

function updateSpend(claudeCostUsd) {
  const rows = Object.values(workers);
  if (!rows.length) return;
  const useX402 = window._statusFlags?.USE_X402 === true;
  const searchTotal = rows.reduce((s, r) => s + (r.spend || 0), 0);

  let html = rows.map(r => {
    const costLabel = useX402
      ? `$${(r.spend || 0).toFixed(4)} USDC`
      : `Free (Tavily dev key)`;
    const meta = `${r.queriesRun ?? '?'} quer${(r.queriesRun ?? 0) === 1 ? 'y' : 'ies'} · ${r.findings?.length ?? 0} results`;
    return `
    <div class="spend-row">
      <span>${escHtml(r.task?.role || `Worker ${r.taskIndex}`)}<span style="color:#475569;font-size:0.72rem;margin-left:0.5rem">${meta}</span></span>
      <span>${costLabel} · ${escHtml(r.serviceUsed || '—')}</span>
    </div>`;
  }).join('');

  if (claudeCostUsd != null) {
    html += `
    <div class="spend-row">
      <span>Claude AI<span style="color:#475569;font-size:0.72rem;margin-left:0.5rem">planning + synthesis</span></span>
      <span>$${claudeCostUsd.toFixed(2)} USD</span>
    </div>`;
  }

  const grandTotal = searchTotal + (claudeCostUsd || 0);
  const totalLabel = useX402 ? `$${grandTotal.toFixed(2)}` : `$${(claudeCostUsd || 0).toFixed(2)} USD + free searches`;
  html += `<div class="spend-row"><span>Total</span><span>${totalLabel}</span></div>`;

  document.getElementById('spendTable').innerHTML = html;
  document.getElementById('spendCard').style.display = 'block';
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderMarkdown(text) {
  const lines = String(text ?? '').split('\n');
  let html = '';
  for (const line of lines) {
    let l = line
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
      // links
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
      // bold
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      // italic
      .replace(/\*([^*]+)\*/g, '<em>$1</em>');
    if (/^### /.test(line)) {
      html += `<h4 style="color:#a78bfa;margin:1rem 0 0.4rem;font-size:0.9rem">${l.replace(/^### /, '')}</h4>`;
    } else if (/^## /.test(line)) {
      html += `<h3 style="color:#a78bfa;margin:1.2rem 0 0.5rem;font-size:1rem">${l.replace(/^## /, '')}</h3>`;
    } else if (/^# /.test(line)) {
      html += `<h2 style="color:#c4b5fd;margin:1.2rem 0 0.5rem;font-size:1.1rem">${l.replace(/^# /, '')}</h2>`;
    } else if (/^- /.test(line) || /^\* /.test(line)) {
      html += `<div style="padding:0.15rem 0 0.15rem 1rem">• ${l.replace(/^[-*] /, '')}</div>`;
    } else if (l.trim() === '') {
      html += '<div style="height:0.6rem"></div>';
    } else {
      html += `<div>${l}</div>`;
    }
  }
  return html;
}
